name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - name: Testes
        run: npm test
      - name: Gerar o visualizador DWG/DXF
        run: npm run build:cad
      - name: Gerar o site estático
        run: npx vite build
        env:
          NODE_ENV: production
          STATIC_SITE: '1'
          VITE_STATIC_SITE: '1'
          # Repositório <usuario>.github.io é servido na raiz; os demais em /<repositório>.
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}
      - run: cp site/index.html site/404.html && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
