name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - name: Testes
        run: npm test
      - name: Preparar o Rust para WebAssembly (gravador DWG)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            cad/dwg-writer/target
          key: dwg-writer-${{ runner.os }}-${{ hashFiles('cad/dwg-writer/Cargo.lock', 'cad/dwg-writer/src/**') }}
          restore-keys: dwg-writer-${{ runner.os }}-
      - name: Instalar alvo WebAssembly e wasm-bindgen
        id: wasmtools
        continue-on-error: true
        run: |
          rustup target add wasm32-unknown-unknown
          WB=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, ""); print; exit}' cad/dwg-writer/Cargo.lock)
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$WB"; then cargo install wasm-bindgen-cli --version "$WB" --locked --force; fi
          wasm-bindgen --version
      - name: Gerar o gravador DWG (acadrust em WebAssembly)
        # Without it the app still works and saves DXF; the step is reported but does not stop the release.
        if: steps.wasmtools.outcome == 'success'
        continue-on-error: true
        run: |
          cargo test --release --manifest-path cad/dwg-writer/Cargo.toml
          npm run build:dwg
          ls -la cad/public/dwg
      - name: Gerar o visualizador DWG/DXF
        run: npm run build:cad
      - name: Gerar o site estático
        run: npx vite build
        env:
          NODE_ENV: production
          STATIC_SITE: '1'
          VITE_STATIC_SITE: '1'
          # Repositório <usuario>.github.io é servido na raiz; os demais em /<repositório>.
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}
      - run: cp site/index.html site/404.html && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
