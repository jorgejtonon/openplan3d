name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    # 24.04 ships the Android SDK; ubuntu-latest is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - name: Testes
        run: npm test
      - name: Gerar o app web (sem servidor)
        run: npx vite build && cp site/index.html site/404.html
        env:
          NODE_ENV: production
          STATIC_SITE: '1'
          VITE_STATIC_SITE: '1'
          BASE_PATH: ''
      - name: Copiar para o projeto Android
        if: env.HAS_KEYSTORE == 'true'
        run: npx cap sync android
      - uses: actions/setup-java@v5
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Preparar o Android SDK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"; mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "SDK: $SDK  sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "platform-tools"
          # Gradle downloads the build-tools it needs itself; this only saves time.
          "$SDKMANAGER" --sdk_root="$SDK" "build-tools;36.0.0" || true

      - name: Conferir a chave de assinatura
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Spaces and line breaks picked up when pasting are not part of base64.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > "$RUNNER_TEMP/keystore.b64"
          chars=$(wc -c < "$RUNNER_TEMP/keystore.b64")
          echo "::notice::ANDROID_KEYSTORE_BASE64: $chars caracteres; senha: ${#ANDROID_KEYSTORE_PASSWORD}; alias: ${#ANDROID_KEY_ALIAS}; senha da chave: ${#ANDROID_KEY_PASSWORD}"
          if ! base64 -d "$RUNNER_TEMP/keystore.b64" > "$RUNNER_TEMP/openplan3d.keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 não é um texto base64 válido ($chars caracteres). Cole só a linha longa do SEGREDOS-GITHUB.txt, inteira, sem o rótulo 'Valor'."
            exit 1
          fi
          if [ "$ANDROID_KEY_PASSWORD" != "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_PASSWORD precisa ser igual a ANDROID_KEYSTORE_PASSWORD (a mesma senha)."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/openplan3d.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::A chave abriu, mas a senha (ANDROID_KEYSTORE_PASSWORD) ou o alias (ANDROID_KEY_ALIAS = openplan3d) não conferem."
            exit 1
          fi
          echo "::notice::Chave de assinatura conferida."

      - name: Compilar APK (assinatura fixa, com os segredos do repositório)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cd android && chmod +x gradlew
          if ! ./gradlew --no-daemon assembleRelease > "$RUNNER_TEMP/gradle.log" 2>&1; then
            cat "$RUNNER_TEMP/gradle.log"
            # The cause, readable as an annotation even where logs are not.
            summary=$(grep -E "What went wrong|error:|Error|FAILURE|> " "$RUNNER_TEMP/gradle.log" | grep -v "^> Task" | head -25 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle falhou::$summary"
            exit 1
          fi
          tail -5 "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/OpenPlan3D.apk"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/openplan3d.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Aviso — chave de assinatura não cadastrada
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::APK não gerado: cadastre os 4 segredos ANDROID_* (arquivo SEGREDOS-GITHUB.txt) em Settings → Secrets and variables → Actions e rode este workflow de novo. Sem assinatura fixa, cada versão exigiria desinstalar o app e apagaria os projetos salvos nele."

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: OpenPlan3D-apk
          path: OpenPlan3D.apk

      - name: Publicar em Releases (link fixo para o celular)
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: OpenPlan3D Android 1.0.${{ github.run_number }}
          make_latest: true
          files: OpenPlan3D.apk
          body: |
            Para instalar no Android: abra este link no celular, toque em **OpenPlan3D.apk** e permita "instalar apps desconhecidos" para o navegador.
            Link fixo para a versão mais recente: https://github.com/${{ github.repository }}/releases/latest/download/OpenPlan3D.apk
